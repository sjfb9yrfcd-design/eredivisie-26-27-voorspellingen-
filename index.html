    <!-- Header -->
    <header class="bg-gray-100 border-b border-gray-200 py-4 px-6 sticky top-0 z-50" role="banner">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-tight">Eredivisie Voorspeller <span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded-full uppercase">2026/27</span></h1>
                <p class="text-xs text-gray-500">Feyenoord, AZ, Ajax & PSV - Officieel KNVB Schema</p>
            </div>
            
            <div class="flex items-center gap-3">
                <label for="username" class="sr-only">Jouw naam voor opslaan</label>
                <input type="text" id="username" placeholder="Jouw naam..." class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="savePredictions()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer" aria-label="Sla alle voorspellingen op onder je ingevoerde naam">Opslaan</button>
                <button onclick="resetData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition cursor-pointer" aria-label="Wis alle opgeslagen voorspellingen">Wissen</button>
            </div>
        </div>
    </header>

    <!-- Virtuele Stand & Kampioen Banner -->
    <section class="bg-gray-50 border-b border-gray-200 py-6 px-6" aria-labelledby="standings-heading">
        <div class="max-w-7xl mx-auto">
            <h2 id="standings-heading" class="text-sm font-semibold uppercase tracking-wider text-gray-500 mb-3">Virtuele Stand (Inclusief huidige stand t/m R8)</h2>
            <div id="standings" class="grid grid-cols-2 md:grid-cols-4 gap-4" aria-live="polite" aria-atomic="true">
                <!-- Wordt dynamisch gevuld -->
            </div>
        </div>
    </section>

    <!-- Main Content: 4 Club Kolommen -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full" role="main">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="club-columns">
            <!-- Wordt dynamisch gevuld -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-50 border-t border-gray-200 py-4 text-center text-xs text-gray-500" role="contentinfo">
        Officiële KNVB Eredivisie 2026/27 speelschema's • Geactualiseerd t/m speelronde 8 • Volledig toegankelijk
    </footer>

                    { round: 33, opponent: "Sparta Rotterdam", venue: "thuis" },
                    { round: 34, opponent: "SC Cambuur", venue: "uit" }
                ]
            }
        };

        let userPredictions = JSON.parse(localStorage.getItem('eredivisie_predictions')) || {};
        let currentUsername = localStorage.getItem('eredivisie_username') || '';

        document.getElementById('username').value = currentUsername;

        function renderApp() {
            const columnsContainer = document.getElementById('club-columns');
            columnsContainer.innerHTML = '';

            let totals = {};

            for (const [clubKey, clubObj] of Object.entries(clubData)) {
                totals[clubKey] = clubObj.basePoints;
                clubObj.matches.forEach((match, index) => {
                    const key = `${clubKey}_${index}`;
                    const pts = userPredictions[key] !== undefined ? parseInt(userPredictions[key]) : 0;
                    totals[clubKey] += pts;
                });
            }

            const sortedStandings = Object.entries(totals).sort((a, b) => b[1] - a[1]);

            const standingsContainer = document.getElementById('standings');
            standingsContainer.innerHTML = '';
            sortedStandings.forEach(([clubKey, points], index) => {
                const club = clubData[clubKey];
                const isLeader = index === 0;
                standingsContainer.innerHTML += `
                    <div class="bg-white border ${isLeader ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-200'} rounded-xl p-4 flex items-center justify-between shadow-2xs">
                        <div>
                            <span class="text-xs font-bold text-gray-400">Plaats ${index + 1}</span>
                            <h3 class="font-bold text-gray-800">${club.name}</h3>
                            ${isLeader ? '<span class="text-[10px] bg-blue-100 text-blue-700 font-semibold px-1.5 py-0.5 rounded">Virtueel Kampioen</span>' : ''}
                        </div>
                        <div class="text-2xl font-black text-gray-900" aria-label="${club.name} heeft ${points} punten">${points} <span class="text-xs font-normal text-gray-500">pt</span></div>
                    </div>
                `;
            });

            for (const [clubKey, clubObj] of Object.entries(clubData)) {
                let matchesHTML = '';
                clubObj.matches.forEach((match, index) => {
                    const key = `${clubKey}_${index}`;
                    const currentVal = userPredictions[key] !== undefined ? userPredictions[key] : "";

                    const is3Active = currentVal == 3;
                    const is1Active = currentVal == 1;
                    const is0Active = currentVal === 0 && currentVal !== "";

                    matchesHTML += `
                        <div class="bg-white border border-gray-100 rounded-lg p-2.5 flex items-center justify-between text-xs shadow-2xs">
                            <div>
                                <span class="font-semibold text-gray-400 mr-1">Ronde ${match.round}</span>
                                <span class="text-gray-700">${match.venue === 'thuis' ? 'Thuis tegen' : 'Uit tegen'} ${match.opponent}</span>
                            </div>
                            <div class="flex gap-1" role="group" aria-label="Voorspelling voor ${clubObj.name} tegen ${match.opponent}">
                                <button onclick="setPoints('${key}', 3)" 
                                    aria-pressed="${is3Active}" 
                                    aria-label="3 punten (winst) voor ${clubObj.name} in speelronde ${match.round} tegen ${match.opponent}"
                                    class="px-2 py-1 rounded text-[11px] font-medium transition cursor-pointer ${is3Active ? 'bg-green-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}">+3</button>
                                <button onclick="setPoints('${key}', 1)" 
                                    aria-pressed="${is1Active}" 
                                    aria-label="1 punt (gelijkspel) voor ${clubObj.name} in speelronde ${match.round} tegen ${match.opponent}"
                                    class="px-2 py-1 rounded text-[11px] font-medium transition cursor-pointer ${is1Active ? 'bg-amber-500 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}">+1</button>
                                <button onclick="setPoints('${key}', 0)" 
                                    aria-pressed="${is0Active}" 
                                    aria-label="0 punten (verlies) voor ${clubObj.name} in speelronde ${match.round} tegen ${match.opponent}"
                                    class="px-2 py-1 rounded text-[11px] font-medium transition cursor-pointer ${is0Active ? 'bg-red-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}">0</button>
                            </div>
                        </div>
                    `;
                });

                columnsContainer.innerHTML += `
                    <section aria-labelledby="heading-${clubKey}" class="border border-gray-200 rounded-xl bg-gray-50/50 flex flex-col overflow-hidden shadow-2xs">
                        <div class="p-3 border-b border-gray-200 bg-white flex justify-between items-center">
                            <div>
                                <h3 id="heading-${clubKey}" class="font-bold text-gray-800">${clubObj.name}</h3>
                                <span class="text-[10px] text-gray-400">Start: ${clubObj.basePoints} pt</span>
                            </div>
                            <span class="text-xs font-bold px-2 py-0.5 rounded ${clubObj.badge}" aria-label="Totaal ${totals[clubKey]} punten">${totals[clubKey]} pt</span>
                        </div>
                        <div class="p-3 flex flex-col gap-2 max-h-[600px] overflow-y-auto" role="region" aria-label="Speelschema van ${clubObj.name}">
                            ${matchesHTML}
                        </div>
                    </section>
                `;
            }
        }

        function setPoints(key, points) {
            if (userPredictions[key] === points) {
                delete userPredictions[key];
            } else {
                userPredictions[key] = points;
            }
            renderApp();
        }

        function savePredictions() {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) {
                alert("Vul eerst even je naam in!");
                return;
            }
            localStorage.setItem('eredivisie_username', nameInput);
            localStorage.setItem('eredivisie_predictions', JSON.stringify(userPredictions));
            alert(`Voorspellingen succesvol opgeslagen voor ${nameInput}!`);
        }

        function resetData() {
            if (confirm("Weet je zeker dat je alle voorspellingen wilt wissen?")) {
                userPredictions = {};
                localStorage.removeItem('eredivisie_predictions');
                renderApp();
            }
        }

        renderApp();
    </script>
